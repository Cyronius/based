# Traces: BASED-RELEASE-CI — Phase 6 of specs/based/plans/macos-port.md.
#
# The tag-triggered half of the release pipeline. scripts/release.ps1 owns the local half
# (bump → changelog edit → commit → tag → push); pushing the v* tag lands here, which verifies,
# builds both platforms, and publishes one GitHub release with both artifacts. Secondary benefit:
# Windows releases stop depending on whatever is installed on one machine (docs/development.md
# tracked that as future work).
#
# Runner images are pinned (not -latest) so a release is reproducible; bump them deliberately.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell-tauri

      - name: Check tag matches tauri.conf.json version
        shell: bash
        run: |
          VERSION=$(jq -r .version shell-tauri/tauri.conf.json)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag v$TAG does not match shell-tauri/tauri.conf.json version $VERSION" >&2
            exit 1
          fi

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The verify gate that used to run locally in release.ps1 step 2.
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: bun run test

      - name: Build Windows installer
        shell: pwsh
        run: .\scripts\package-win.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/based-*-Setup.exe
          if-no-files-found: error

  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell-tauri

      - name: Check tag matches tauri.conf.json version
        run: |
          VERSION=$(jq -r .version shell-tauri/tauri.conf.json)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag v$TAG does not match shell-tauri/tauri.conf.json version $VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build UI
        run: bun run build:ui

      # BASED-PLATFORM-PATHS: resolves every native addon by host platform+arch — fails first if a
      # darwin-arm64 prebuild is missing.
      - name: Bundle core
        working-directory: shell-tauri
        run: bun bundle-core.ts

      # Fail loudly here rather than shipping a .dmg that dies on first launch (BASED-PACKAGE-MAC).
      - name: Verify bundle layout
        working-directory: shell-tauri
        run: |
          set -euo pipefail
          test -f dist-core/core/index.js         || { echo "missing core/index.js"; exit 1; }
          test -f dist-core/core/libduckdb.dylib  || { echo "missing core/libduckdb.dylib"; exit 1; }
          test -f dist-core/ui/dist/index.html    || { echo "missing ui/dist/index.html"; exit 1; }
          test -x dist-core/bun/bun               || { echo "missing or non-executable bun/bun"; exit 1; }

      - name: Build Tauri app
        working-directory: shell-tauri
        run: bun x @tauri-apps/cli build

      - name: Name the DMG
        run: |
          VERSION=$(jq -r .version shell-tauri/tauri.conf.json)
          DMG=$(ls shell-tauri/target/release/bundle/dmg/*.dmg)
          cp "$DMG" "based-$VERSION-macos-arm64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: based-*-macos-arm64.dmg
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Assemble release notes
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          EXE="artifacts/based-$VERSION-Setup.exe"
          DMG="artifacts/based-$VERSION-macos-arm64.dmg"
          test -f "$EXE" && test -f "$DMG"
          EXE_SHA=$(sha256sum "$EXE" | cut -d' ' -f1)
          DMG_SHA=$(sha256sum "$DMG" | cut -d' ' -f1)

          # The CHANGELOG section for this version (written and edited locally by release.ps1
          # before the tag was pushed), minus its "## [x.y.z] - date" heading.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          fi

          cat >> notes.md <<EOF

          ### Install — Windows

          Download \`based-$VERSION-Setup.exe\` and run it. Per-user install, no admin required.

          The installer is **not code-signed**, so Windows SmartScreen will show "Windows protected
          your PC" on first run — click **More info**, then **Run anyway**. Verify the download
          first if you like:

          \`\`\`powershell
          (Get-FileHash .\based-$VERSION-Setup.exe -Algorithm SHA256).Hash
          # $EXE_SHA
          \`\`\`

          ### Install — macOS (Apple Silicon)

          The easy way skips Gatekeeper entirely:

          \`\`\`bash
          brew tap cyronius/based
          brew install --cask based --no-quarantine
          \`\`\`

          Or download \`based-$VERSION-macos-arm64.dmg\` and drag based to Applications. The app is
          **not code-signed**, so macOS will say it "is damaged and can't be opened" — that's
          Gatekeeper quarantine, not damage. Either allow it under System Settings → Privacy &
          Security → **Open Anyway**, or clear the quarantine flag:

          \`\`\`bash
          xattr -cr /Applications/based.app
          # verify the download: shasum -a 256 based-$VERSION-macos-arm64.dmg
          # $DMG_SHA
          \`\`\`
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "artifacts/based-$VERSION-Setup.exe" \
            "artifacts/based-$VERSION-macos-arm64.dmg" \
            --title "based $VERSION" \
            --notes-file notes.md

      # Bump the Homebrew tap (Cyronius/homebrew-based) so `brew upgrade` tracks releases.
      # Requires a TAP_PUSH_TOKEN repo secret (a fine-grained PAT with contents:write on the tap
      # repo — the default GITHUB_TOKEN cannot push to a different repository). Skips with a
      # warning when the secret is absent so a missing tap never blocks the release itself.
      - name: Bump Homebrew tap
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_PUSH_TOKEN:-}" ]; then
            echo "::warning::TAP_PUSH_TOKEN not set — skipping Homebrew tap bump"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_SHA=$(sha256sum "artifacts/based-$VERSION-macos-arm64.dmg" | cut -d' ' -f1)
          git clone "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/Cyronius/homebrew-based.git" tap
          mkdir -p tap/Casks
          sed -e "s/{{VERSION}}/$VERSION/g" -e "s/{{SHA256}}/$DMG_SHA/g" \
            scripts/homebrew-cask.rb.tmpl > tap/Casks/based.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/based.rb
          git commit -m "based $VERSION"
          git push
