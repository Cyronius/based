# Traces: BASED-PACKAGE-LINUX, BASED-RELEASE-CI
# Keep the build baseline at Fedora 43: building on a newer glibc can break older hosts.
name: build (Fedora)

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container: fedora:43
    timeout-minutes: 60
    steps:
      - name: Install Fedora build and test dependencies
        run: >-
          dnf install -y gcc gcc-c++ make rust cargo pkgconf-pkg-config
          webkit2gtk4.1-devel openssl-devel libxdo-devel libsecret-devel librsvg2-devel
          curl unzip file git tar gzip zstd dbus-daemon gnome-keyring rpm-build

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell-tauri

      - name: Check release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(bun -p 'require("./shell-tauri/tauri.conf.json").version')
          test "$VERSION" = "${GITHUB_REF_NAME#v}"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Tests with an isolated Secret Service
        env:
          BASED_KEYRING_SERVICE: based-ci
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          dbus-run-session -- sh -eu -c '
            printf "based-ci\n" | gnome-keyring-daemon --unlock --components=secrets
            bun run test
          '

      - name: Build Fedora RPM
        run: bun run package:linux

      - name: Verify RPM installs and its desktop entry accepts files
        run: |
          dnf install -y ./dist/based-*-fedora-x86_64.rpm
          test -x /usr/lib/based/bun/bun
          test -f /usr/lib/based/core/libduckdb.so
          grep -q '^Exec=based-shell %F$' /usr/share/applications/based.desktop

      - uses: actions/upload-artifact@v4
        with:
          name: fedora-rpm
          path: |
            dist/based-*-fedora-x86_64.rpm
            dist/based-*-fedora-x86_64.rpm.sha256
          if-no-files-found: error
