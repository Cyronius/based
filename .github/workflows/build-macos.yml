# The manual (workflow_dispatch) macOS build — a .dmg from any branch, for testing the port
# without cutting a release. The tag-triggered release pipeline is release.yml (BASED-RELEASE-CI);
# this stays as the way to hand-test macOS changes from a WIP branch, and mirrors the release
# job's steps (including --frozen-lockfile) so a green run here means the release job will build.
name: build (macOS)

on:
  workflow_dispatch:

jobs:
  build:
    # macos-latest is Apple Silicon, and arm64 is the only macOS target we ship (see the plan's
    # "arm64 only" decision — macOS Tahoe 26 is Apple's last Intel release). Fine to float here;
    # the release workflow pins its image (macos-15) so releases are reproducible.
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell-tauri

      # --frozen-lockfile mirrors release.yml — a green run here proves the release job's install.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build UI
        run: bun run build:ui

      # BASED-PLATFORM-PATHS: this resolves every native addon by host platform+arch, so it is the
      # step that fails first if a darwin-arm64 prebuild is missing from any of duckdb / lancedb /
      # libsql / keyring.
      - name: Bundle core
        working-directory: shell-tauri
        run: bun bundle-core.ts

      # Fail loudly here rather than shipping a .dmg that dies on first launch. Each check maps to
      # a specific Phase 1 change: the darwin companion library name, and the bun runtime's
      # platform filename plus its executable bit.
      - name: Verify bundle layout
        working-directory: shell-tauri
        run: |
          set -euo pipefail
          test -f dist-core/core/index.js         || { echo "missing core/index.js"; exit 1; }
          test -f dist-core/core/libduckdb.dylib  || { echo "missing core/libduckdb.dylib"; exit 1; }
          test -f dist-core/ui/dist/index.html    || { echo "missing ui/dist/index.html"; exit 1; }
          test -x dist-core/bun/bun               || { echo "missing or non-executable bun/bun"; exit 1; }
          echo "--- bundled natives ---"
          ls -la dist-core/core

      - name: Build Tauri app
        working-directory: shell-tauri
        run: bun x @tauri-apps/cli build

      - uses: actions/upload-artifact@v4
        with:
          name: based-macos-arm64
          path: shell-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
