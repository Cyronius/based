name: Bug report
description: Something in based misbehaves
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The version and engine fields below are the two that most often
        decide whether a bug is reproducible, so please fill them in.

  - type: input
    id: version
    attributes:
      label: based version
      description: Shown at the right-hand end of the status bar (e.g. `v0.1.0`).
      placeholder: v0.1.0
    validations:
      required: true

  - type: dropdown
    id: engine
    attributes:
      label: Engine
      options:
        - SQL Server / Azure SQL
        - LanceDB (local)
        - LanceDB (cloud)
        - Not engine-specific
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a query tab on ...
        2. Run ...
        3. ...

  - type: textarea
    id: logs
    attributes:
      label: Errors or logs
      description: >
        Anything from the Output pane, plus `%LOCALAPPDATA%\Programs\based\bin\app.log` if the app
        failed to start. Please redact server names, credentials, and row data.
      render: text

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 Pro 24H2

  - type: textarea
    id: model
    attributes:
      label: Model setup
      description: Only if the bug involves the agent — provider kind, base URL, and model.
      placeholder: openai-compatible, http://localhost:1234/v1, qwen3.5-9b-mtp
