[package]
name = "based-shell"
version = "0.1.5"
description = "based — Tauri shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# Loopback-only plain HTTP; no TLS stack needed.
ureq = { version = "2", default-features = false }
urlencoding = "2"

[profile.release]
strip = true
lto = true
